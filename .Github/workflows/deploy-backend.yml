name: Deploy Fleet Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'fleet-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: fleet-backend
        run: npm ci

      # ← replaces publish profile
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smart-axia-fleet-manager-server'
          package: ./fleet-backend