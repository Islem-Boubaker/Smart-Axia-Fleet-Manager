name: Deploy Fleet ML Recommendation

on:
  push:
    branches: [main]
    paths:
      - 'fleet-recommendation-services/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build & push Docker image to Azure Container Registry ──────────────
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./fleet-recommendation-services
          file: ./fleet-recommendation-services/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/fleet-ml:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/fleet-ml:latest

      # ── Deploy the new image to Azure App Service ───────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smart-axia-fleet-recommendation'
          images: '${{ secrets.ACR_LOGIN_SERVER }}/fleet-ml:${{ github.sha }}'
