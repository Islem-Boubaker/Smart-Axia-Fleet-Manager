version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React Native
  - Expo
  - Tailwind CSS
  - Firebase
routes:
  - path: /
    file: app/index.tsx
    auth_required: false
    description: Initial route
  - path: /(auth)/login
    file: app/(auth)/login.tsx
    auth_required: false
    description: Login screen
  - path: /(auth)/forgotPassword
    file: app/(auth)/forgotPassword.tsx
    auth_required: false
    description: Forgot password screen
  - path: /(tabs)/home
    file: app/(tabs)/home.tsx
    auth_required: true
    description: Main dashboard
features:
  - name: Authentication
    description: Firebase auth login and password recovery
    files:
      - app/(auth)/login.tsx
      - features/auth/screens/LoginScreen.tsx
    entry_route: /(auth)/login
    user_interactions:
      - Fill email input
      - Fill password input
      - Click Login
    api_calls: []
    auth_required: false
known_limitations: []
